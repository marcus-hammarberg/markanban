<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markanban</title>
  <script>
    // Apply theme before first paint to avoid a flash. Same logic as setTheme() in app.js.
    try {
      const mode = localStorage.getItem('markanban-theme') || 'system';
      document.documentElement.dataset.theme = mode === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
    } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="style.css">
  <!-- Themes: each file overrides tokens (and anything else) under :root[data-theme="…"] -->
  <link rel="stylesheet" href="themes/dark.css">
  <link rel="stylesheet" href="themes/whiteboard.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Markanban</h1>
    <label class="toggle"><input type="checkbox" id="show-archived"> Show archived</label>
    <button id="replay-start" title="Play back how cards moved over time">▶ Replay</button>
    <select id="theme" title="Theme" aria-label="Theme">
      <option value="system">◐ System</option>
      <option value="light">☀ Light</option>
      <option value="dark">☾ Dark</option>
      <option value="whiteboard">✎ Whiteboard</option>
    </select>
  </header>
  <div id="error" class="error" hidden></div>
  <div id="warnings" class="warnings" hidden></div>
  <div class="filters" id="filters">
    <input type="search" id="filter-q" placeholder="Search…" aria-label="Search heading, body, comments and attachment names">
    <select id="filter-type" aria-label="Filter by type"></select>
    <select id="filter-assignee" aria-label="Filter by assignee"></select>
    <select id="filter-tag" aria-label="Filter by tag"></select>
    <button id="filter-clear" hidden>Clear</button>
  </div>
  <div id="replay-bar" class="replay-bar" hidden>
    <span class="replay-label">● Replay · read-only</span>
    <button id="replay-play" class="primary"></button>
    <input type="range" id="replay-time" step="any" aria-label="Replay time">
    <output id="replay-clock" for="replay-time"></output>
    <button id="replay-exit">Exit replay</button>
  </div>
  <main id="board" class="board"></main>

  <dialog id="card-dialog">
    <form id="card-form" method="dialog">
      <header class="dialog-head">
        <input name="heading" class="heading-input" aria-label="Heading" required>
        <button type="button" id="copy-link" class="icon" title="Copy link to this card" aria-label="Copy link to this card">🔗</button>
        <button value="close" class="icon" aria-label="Close" formnovalidate>✕</button>
      </header>
      <div class="fields">
        <label>Status <input name="status" list="status-list"></label>
        <label>Type <input name="type"></label>
        <label>Assignee <input name="assignee"></label>
        <label>Tags <input name="tags" placeholder="comma, separated"></label>
      </div>
      <div id="extra" class="chips"></div>
      <label class="body-label"><textarea name="body" rows="12" aria-label="Body"></textarea></label>
      <details id="attachments-section">
        <summary id="attachments-title">Attachments</summary>
        <div class="attachments">
          <ul id="attachments" class="attachment-list"></ul>
          <div class="attachment-add">
            <button type="button" id="add-file">Add file</button>
            <span class="muted">or drop or paste a file here</span>
            <input type="file" id="file-input" multiple hidden>
          </div>
        </div>
      </details>
      <details id="comments-section">
        <summary id="comments-title">Comments</summary>
        <div class="comments">
          <ol id="comments" class="comment-list"></ol>
          <textarea id="new-comment" rows="3" placeholder="Write a comment… (markdown)" aria-label="New comment"></textarea>
          <div><button type="button" id="add-comment">Add comment</button></div>
        </div>
      </details>
      <details id="history-section">
        <summary>History</summary>
        <ul id="history" class="history"></ul>
      </details>
      <footer class="dialog-foot">
        <button type="button" id="archive"></button>
        <span class="muted" id="dates"></span>
        <button value="save" class="primary" title="Save (Ctrl+Enter)">Save</button>
      </footer>
    </form>
  </dialog>
  <datalist id="status-list"></datalist>

  <script type="module" src="app.js"></script>
</body>
</html>
