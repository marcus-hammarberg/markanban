# Every push to main (trunk-based) and every pull request: lint, type check and tests, then a smoke
# test of the built package. Same checks as locally (npm run check). Actions are pinned to commit SHAs
# (tag in the comment); Dependabot keeps them current.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false # see every platform's result, not just the first failure
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] # macOS primary; Windows: CRLF and paths
        node: ['22.18', '24'] # oldest supported (package.json engines) and current
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # also builds dist/ (the prepare script)
      - run: npm run check

      # The tests run src/ directly; npx runs the compiled dist/. Start it and load the page and the API.
      - name: Smoke test the built package
        shell: bash
        run: |
          node dist/cli.js --help
          node dist/cli.js "$RUNNER_TEMP/smoke-board" --port 4999 --no-open --user ci &
          for i in $(seq 30); do curl -sf http://localhost:4999/api/board > board.json && break; sleep 1; done
          grep -q '"cards":\[\]' board.json
          curl -sf http://localhost:4999/ | grep -q 'id="board"'
          kill %1
