# Weekly update PRs for npm packages and the SHA-pinned GitHub Actions. The Check workflow runs on
# each PR. A release must be 7 days old before it's proposed (time for bad releases to be pulled).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies: # one PR for all dev tooling (biome, markdownlint, typescript, @types/node)
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
